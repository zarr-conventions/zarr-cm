name: Check Upstream Drift

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check-upstream:
    name: Detect schema drift against upstream main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v4

      - name: Check for upstream schema drift
        run: just check-upstream
