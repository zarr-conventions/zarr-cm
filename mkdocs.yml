site_name: zarr-cm
site_url: https://zarr-cm.readthedocs.io/
site_author: "Davis Bennett"

repo_name: "zarr-conventions/zarr-cm"
repo_url: "https://github.com/zarr-conventions/zarr-cm"

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - search.suggest
    - search.highlight
    - navigation.expand
    # A section's index page is the section entry itself, so "Examples" and
    # "Blog" are not listed twice (once as section, once as "Examples"/"Blog").
    - navigation.indexes
    - navigation.tracking
    - toc.follow
  palette:
    # See options to customise your color scheme here:
    # https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  # Blog posts use `[^n]` footnotes.
  - footnotes
  - pymdownx.highlight
  - pymdownx.superfences
  # Lets docs pages include files by path (--8<--); the docs/examples pages use
  # it to embed each example's README.md and source from examples/.
  - pymdownx.snippets

plugins:
  autorefs: {}
  # Developer blog: docs/blog/posts/*.md, listed at /blog/. Posts are plain
  # Markdown with a `date` in the front matter; `draft: true` keeps a post out
  # of the built site until it is ready.
  blog:
    blog_dir: blog
    post_url_format: "{date}/{slug}"
    archive: false
    categories: false
  mkdocstrings:
    handlers:
      python:
        paths: [.]
        inventories:
          - https://docs.python.org/3/objects.inv
        options:
          members_order: source
          separate_signature: true
          filters: ["!^_"]
          show_root_heading: true
          show_if_no_docstring: true
          show_signature_annotations: true
  search: {}

nav:
  - Home: index.md
  - Python API: api.md
  - Release notes: release-notes.md
  - Examples:
      - examples/index.md
      - examples/composition.md
      - examples/reading.md
      - examples/spatial.md
      - examples/proj.md
      - examples/multiscales.md
      - examples/license.md
      - examples/uom.md
  - Blog:
      - blog/index.md
